<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0d17">
<title>DUEL UP — Play with Friends</title>
<style>
:root{--bg:#0b0d17;--panel:#131726;--panel2:#191f31;--line:#2b334a;--text:#f4f6ff;--muted:#9ba5bf;--cyan:#64f5dc;--purple:#a78bfa;--pink:#ff79c6;--gold:#ffd166;--red:#ff647c}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 80% -10%,#28234c 0,transparent 42%),var(--bg);color:var(--text);font:15px/1.45 Inter,ui-sans-serif,system-ui,sans-serif}
button,input{font:inherit}
button{cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.app{max-width:1180px;margin:auto;padding:0 24px 45px}
.topbar{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff12}
.brand{display:flex;align-items:center;gap:10px;font-weight:950;letter-spacing:1.8px;font-size:20px}
.brandmark{display:grid;place-items:center;width:36px;height:36px;background:linear-gradient(135deg,var(--cyan),var(--purple));color:#101421;border-radius:11px;font-size:21px}
.brand span{color:var(--cyan)}
.muted{color:var(--muted)}
.tiny{font-size:12px}
.pill{font-size:11px;color:var(--cyan);border:1px solid #64f5dc44;background:#64f5dc0c;padding:6px 10px;border-radius:30px}
.btn{padding:11px 15px;border-radius:11px;font-weight:800;border:0;transition:.15s}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.primary{background:var(--cyan);color:#0b1420}
.secondary{background:var(--panel2);border:1px solid var(--line)}
.small{padding:8px 11px;font-size:12px}
.hero{padding:42px 0 23px}
.eyebrow{font-size:11px;letter-spacing:2px;font-weight:800;color:var(--cyan)}
h1{font-size:clamp(35px,6vw,56px);line-height:1.03;letter-spacing:-2px;margin:12px 0}
.hero em{font-style:normal;color:var(--cyan)}
.hero p{max-width:480px;color:var(--muted)}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}
.sectionhead{display:flex;justify-content:space-between;align-items:end;margin:25px 0 14px;gap:10px}
.sectionhead h2{margin:0 0 3px;font-size:20px}
.sectionhead p{margin:0;color:var(--muted);font-size:13px}
.games{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.gamecard{position:relative;overflow:hidden;text-align:left;min-height:175px;border-radius:17px;padding:17px;background:linear-gradient(145deg,var(--card,#252d49),#151a2b 72%);border:1px solid #ffffff13;transition:.15s}
.gamecard:hover{transform:translateY(-3px);border-color:#64f5dc88}
.gameicon{font-size:32px;display:block;margin-bottom:10px}
.gamecard h3{margin:0 0 4px;font-size:17px}
.gamecard p{font-size:12px;color:var(--muted);margin:0 0 22px}
.cardbottom{position:absolute;left:17px;right:15px;bottom:13px;display:flex;justify-content:space-between;align-items:center;font-size:10px;color:#c5cbe0}
.lower{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:22px}
.panel{border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,#161b2c,#111522);padding:18px}
.panel h3{margin:0 0 5px;font-size:16px}
.panel p.sub{font-size:12px;color:var(--muted);margin:0 0 14px}
.row{display:flex;gap:8px}
.field{width:100%;min-width:0;background:#0d1120;border:1px solid var(--line);color:var(--text);padding:11px;border-radius:10px}
.notice{font-size:12px;color:var(--muted);margin-top:9px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#ffffff06;border-radius:10px;padding:11px}
.stat strong{font-size:22px;display:block}
.stat span{font-size:10px;color:var(--muted)}
.view{display:none}
.view.active{display:block}
.back{margin:22px 0 14px}
.gamehead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0 18px;flex-wrap:wrap}
.gamehead h2{margin:0;font-size:27px}
.gamehead p{margin:4px 0 0;color:var(--muted);font-size:13px}
.game-layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:14px}
.boardpanel{min-height:380px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(14px,3vw,27px)}
.status{color:var(--cyan);font-weight:800;text-align:center;margin-bottom:16px}
.ttt{display:grid;grid-template-columns:repeat(3,min(24vw,98px));gap:8px}
.ttt button{aspect-ratio:1;border:1px solid var(--line);border-radius:14px;background:#ffffff07;font-size:clamp(30px,7vw,50px);font-weight:900;color:var(--cyan)}
.ttt button:nth-child(even){color:var(--pink)}
.ttt button:disabled{cursor:default}
